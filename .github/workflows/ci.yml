name: Quality checks

on:
  push:
    branches: [phase15-rebuild, ai-studio/mobile-release-validation]
  pull_request:
    branches: [phase15-rebuild, ai-studio/testflight-1-4-2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, and iOS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Export iOS JavaScript bundle
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_OFFLINE: '1'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: npm exec --offline -- expo export --platform ios --output-dir "$RUNNER_TEMP/rituel-ios-export"

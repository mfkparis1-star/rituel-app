name: Quality checks

on:
  push:
    branches: [phase15-rebuild]
  pull_request:
    branches: [phase15-rebuild]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test

  security:
    name: Secret and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned scanners
        run: |
          mkdir -p "$RUNNER_TEMP/rituel-scanners"
          cd "$RUNNER_TEMP/rituel-scanners"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          curl --fail --silent --show-error --location --output osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo 'fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner' | sha256sum --check
          chmod +x osv-scanner
          echo "$RUNNER_TEMP/rituel-scanners" >> "$GITHUB_PATH"
      - name: Scan changed commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: gitleaks git --redact=100 --no-banner --log-opts="$BASE_SHA..$HEAD_SHA"
      - name: Check for new dependency vulnerabilities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git show "$BASE_SHA:package-lock.json" > "$RUNNER_TEMP/package-lock.json"
          scan() {
            local result=0
            osv-scanner scan source --lockfile "$1" --format json > "$2" || result=$?
            if [[ "$result" -gt 1 ]]; then return "$result"; fi
          }
          scan "$RUNNER_TEMP/package-lock.json" "$RUNNER_TEMP/base-osv.json"
          scan package-lock.json "$RUNNER_TEMP/head-osv.json"
          node scripts/compare-osv.cjs "$RUNNER_TEMP/base-osv.json" "$RUNNER_TEMP/head-osv.json"

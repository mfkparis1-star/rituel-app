version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: phase15-rebuild
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: phase15-rebuild
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
